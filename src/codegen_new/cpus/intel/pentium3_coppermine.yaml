# pentium3_coppermine.yaml - Intel Pentium III (Coppermine)

model:
  cpu_id: CPU_PENTIUM3_COPPERMINE
  name: "Intel Pentium III (Coppermine)"
  vendor: "GenuineIntel"
  release_year: 1999
  family: 6
  model_id: 8
  stepping: 3
  package: [SOCKET_370, SLOT_1]
  frequency_range_mhz: [500, 1133]

cpuid:
  signature: 0x00000683
  brand_string: "Intel(R) Pentium(R) III CPU"
  features_edx: 0x0383F9FF # Includes SSE, FXSR, MMX, CMOV, SEP, etc.

isa_level: CPU_PENTIUM3
features:
  - CPU_FEATURE_FPU
  - CPU_FEATURE_VME
  - CPU_FEATURE_DE
  - CPU_FEATURE_TSC
  - CPU_FEATURE_MSR
  - CPU_FEATURE_PAE
  - CPU_FEATURE_MCE
  - CPU_FEATURE_CX8
  - CPU_FEATURE_APIC
  - CPU_FEATURE_SEP
  - CPU_FEATURE_MTRR
  - CPU_FEATURE_PGE
  - CPU_FEATURE_CMOV
  - CPU_FEATURE_PAT
  - CPU_FEATURE_PSE36
  - CPU_FEATURE_MMX
  - CPU_FEATURE_FXSR
  - CPU_FEATURE_SSE

timing_profile: "timings/p6.yaml"

cache:
  l1_instruction_kb: 16
  l1_data_kb: 16
  l2_kb: 256
  l2_speed: full_speed # On-die full speed Advanced Transfer Cache
  l2_bus_width_bits: 256

