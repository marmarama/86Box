# pentium2_klamath.yaml - Intel Pentium II (Klamath, 0.35 um)

model:
  cpu_id: CPU_PENTIUM2
  name: "Intel Pentium II (Klamath)"
  vendor: "GenuineIntel"
  release_year: 1997
  family: 6
  model_id: 3 # Model 3 (0.35 um process)
  stepping: 4
  package: [SLOT_1]
  frequency_range_mhz: [233, 300]
  bus_clock_mhz: [66]

cpuid:
  signature: 0x00000634
  features_edx: 0x008039FF # FPU, VME, DE, PSE, TSC, MSR, PAE, MCE, CX8, APIC, MTRR, PGE, MCA, CMOV, MMX
  # Note: Klamath did NOT support SEP (SYSENTER/SYSEXIT) or FXSR (FXSAVE/FXRSTOR)

isa_level: CPU_PENTIUM2
features:
  - CPU_FEATURE_FPU
  - CPU_FEATURE_VME
  - CPU_FEATURE_DE
  - CPU_FEATURE_PSE
  - CPU_FEATURE_TSC
  - CPU_FEATURE_MSR
  - CPU_FEATURE_PAE
  - CPU_FEATURE_MCE
  - CPU_FEATURE_CX8
  - CPU_FEATURE_APIC
  - CPU_FEATURE_MTRR
  - CPU_FEATURE_PGE
  - CPU_FEATURE_CMOV
  - CPU_FEATURE_MMX
  # Note: Klamath traps SYSENTER/SYSEXIT (#UD) and FXSAVE/FXRSTOR (#UD)

fpu_profile: "fpus/integrated/intel_p6.yaml"

timing_profile: "timings/p6.yaml"

cache:
  l1_instruction_kb: 16
  l1_data_kb: 16
  l2_kb: 512
  l2_speed: half_speed # Off-die custom SRAMs on SECC cartridge PCB running at half core clock

