# 386dx.yaml - Intel 80386DX

model:
  cpu_id: CPU_386DX
  name: "Intel 80386DX"
  vendor: "Intel"
  release_year: 1985
  family: 3
  package: [PGA_132]
  cpu_frequencies_mhz: [16, 20, 25, 33]
  emulated_frequency_range_mhz: [16, 40]
  default_emulated_frequencies_mhz: [16, 20, 25, 33, 40]
  bus_width_bits: 32
  address_bits: 32

isa_level: CPU_386
features: []

supported_coprocessors:
  - "fpus/discrete/intel_80387dx.yaml"
  - "fpus/discrete/cyrix_83d87.yaml"
  - "fpus/discrete/iit_3c87.yaml"
  - "fpus/discrete/weitek_3167.yaml"

timing_profile: "timings/386.yaml"

quirks:
  - id: ERRATUM_386_B0_IMUL
    name: "80386 A/B Stepping 32-bit Multiply Bug"
    category: ARITHMETIC_CORRUPT
    description: |
      Early 80386DX steppings (A and B0/B1) produce incorrect upper bits 
      during 32-bit IMUL/MUL under certain operand patterns (marked '16 BIT S/W ONLY').
    steppings_affected:
      family: 3
      stepping_mask: "<= B1"
    trigger:
      instructions: [IMUL, MUL]
      operand_size: 32
    behavior:
      type: ARITHMETIC_MISCALCULATE
      synthesized_action: "op_imul32_b0_erratum(dst, src);"
    fixed_in: "80386DX stepping D0"


