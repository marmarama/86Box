# 80286.yaml - Intel 80286 (IBM PC/AT)

model:
  cpu_id: CPU_286
  name: "Intel 80286"
  vendor: "Intel"
  release_year: 1982
  family: 2
  package: [PGA_68, PLCC_68]
  cpu_frequencies_mhz: [6, 8, 10, 12, 16, 20, 25]
  emulated_frequency_range_mhz: [6, 25]
  default_emulated_frequencies_mhz: [6, 8, 10, 12, 16, 20, 25]
  bus_width_bits: 16
  address_bits: 24 # 16 MB physical address space

isa_level: CPU_286
features: []

supported_coprocessors:
  - "fpus/discrete/intel_80287.yaml"
  - "fpus/discrete/intel_80287xl.yaml"

timing_profile: "timings/286.yaml"

quirks:
  - id: ERRATUM_286_POPF_IOPL
    name: "80286 Protected Mode POPF Modifies IF with CPL > IOPL"
    category: PRIVILEGE_BYPASS
    description: |
      In 80286 protected mode, POPF allows unprivileged modifications of 
      the Interrupt Flag (IF) even when CPL > IOPL.
    steppings_affected:
      stepping_mask: "all_286"
    trigger:
      opcode: [0x9D]          # POPF
      mode: "PROTECTED"
      condition: "CPL > IOPL"
    behavior:
      type: BYPASS_IOPL_SENSITIVE_FLAG
      synthesized_action: "flags_modify_if_unprivileged();"
    fixed_in: "80386 (ignores IF modification when CPL > IOPL)"

  - id: ERRATUM_286_LOADALL
    name: "Undocumented 80286 LOADALL Opcode"
    category: PRIVILEGE_BYPASS
    description: |
      Undocumented opcode 0x0F 0x05 reads 102 bytes from 0x000800 into all internal 
      CPU registers, descriptor caches, and hidden state in real or protected mode.
    steppings_affected:
      stepping_mask: "all_286"
    trigger:
      opcode: [0x0F, 0x05]
    behavior:
      type: UNDOCUMENTED_INSTRUCTION
      synthesized_action: "op_loadall286(cpu);"
    fixed_in: "80386 (replaced by 0x0F 0x07 for 386 LOADALL)"


