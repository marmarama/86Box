# pentium_mmx.yaml - Intel Pentium MMX (P55C)

model:
  cpu_id: CPU_PENTIUMMMX
  name: "Intel Pentium MMX (P55C)"
  vendor: "GenuineIntel"
  release_year: 1997
  family: 5
  model_id: 4
  stepping: 3
  package: [SOCKET_7]
  cpu_frequencies_mhz: [166, 200, 233]
  emulated_frequency_range_mhz: [133, 266]
  default_emulated_frequencies_mhz: [133, 166, 200, 233, 266]

cpuid:
  signature: 0x00000543
  features_edx: 0x008001BF # FPU, VME, DE, TSC, MSR, CX8, MMX

isa_level: CPU_PENTIUM
features:
  - CPU_FEATURE_FPU
  - CPU_FEATURE_VME
  - CPU_FEATURE_DE
  - CPU_FEATURE_TSC
  - CPU_FEATURE_MSR
  - CPU_FEATURE_CX8
  - CPU_FEATURE_MMX

fpu_profile: "fpus/integrated/intel_pentium.yaml"

timing_profile: "timings/pentium.yaml"

cache:
  l1_instruction_kb: 16
  l1_data_kb: 16
  l1_line_size: 32
  prefix_cache: true

quirks:
  - id: ERRATUM_PENTIUM_F00F
    name: "Pentium F00F (LOCK CMPXCHG8B) Bus Lock Freeze"
    cve: "CVE-1997-10003"
    doc_ref: "Intel Pentium Processor with MMX Technology Specification Update, Erratum 20"
    category: BUS_LOCK_HANG
    description: |
      Executing LOCK CMPXCHG8B with a register operand (F0 0F C7 C8..CF) asserts
      the hardware LOCK# signal for an illegal memory access cycle, hanging the
      memory bus until a hardware reset.
    steppings_affected:
      family: 5
      models: [4, 8]          # P55C, Tillamook
      stepping_mask: "<= 4"   # Early steppings
    trigger:
      opcode: [0x0F, 0xC7]
      modrm_reg: 1
      modrm_mod: 0b11
      required_prefix: PREFIX_LOCK
    behavior:
      type: HANG_BUS_LOCK
      synthesized_action: "cpu_bus_lock_freeze(cpu);"
    fixed_in: "Pentium II (Deschutes)"


