# 8086.yaml - Intel 8086

model:
  cpu_id: CPU_8086
  name: "Intel 8086"
  vendor: "Intel"
  release_year: 1978
  family: 0
  package: [DIP_40]
  cpu_frequencies_mhz: [5, 8, 10]
  emulated_frequency_range_mhz: [4.77, 16]
  default_emulated_frequencies_mhz: [4.77, 7.16, 8, 9.54, 10, 12, 16]
  bus_width_bits: 16

isa_level: CPU_8086
features: []

supported_coprocessors:
  - "fpus/discrete/intel_8087.yaml"

timing_profile: "timings/8086.yaml"

quirks:
  - id: ERRATUM_8086_POP_SS_INT_SHADOW
    name: "8086 Interrupt Non-Shadowing on POP SS"
    category: INTERRUPT_SHADOW
    description: |
      Early 8086 steppings failed to suppress external interrupts on
      the instruction immediately following 'POP SS'.
    steppings_affected:
      stepping_mask: "early_8086"
    trigger:
      opcode: [0x17]          # POP SS
    behavior:
      type: SUPPRESS_INTERRUPT_SHADOW
      synthesized_action: "cpu->interrupt_inhibit = 0;"
    fixed_in: "80186 / 80286 / later 8086 revisions"

  - id: ERRATUM_8086_REP_PREFIX_RESUME
    name: "Interrupt String Instruction Segment Prefix Loss"
    category: PREFIX_RESTART
    description: |
      When an interrupt occurs during a string instruction preceded by multiple
      prefixes (e.g. REP ES: MOVSB), the return address points to the segment
      override rather than REP, losing preceding prefixes on resume.
    steppings_affected:
      stepping_mask: "all"
    trigger:
      prefixes: ["REP", "segment_override"]
      instructions: [MOVSB, MOVSW, LODSB, LODSW, STOSB, STOSW, INSB, INSW, OUTSB, OUTSW]
    behavior:
      type: RESTART_AT_LAST_PREFIX
      synthesized_action: "cpu->ip = last_prefix_ip;"
    fixed_in: "80186 / 80286"


