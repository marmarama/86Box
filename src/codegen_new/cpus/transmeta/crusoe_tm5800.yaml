  name: "Transmeta Crusoe TM5800"
  vendor: "GenuineTMx86"
  release_year: 2001
  family: 5
  model_id: 4
  stepping: 2
  package: [OBGA_474]
  frequency_range_mhz: [667, 1000]

cpuid:
  signature: 0x00000542
  brand_string: "Transmeta(tm) Crusoe(tm) Processor TM5800"
  features_edx: 0x008081BF # FPU, VME, DE, TSC, MSR, CX8, CMOV, MMX

isa_level: CPU_PENTIUM
