  - CPU_FEATURE_FPU
  - CPU_FEATURE_VME
  - CPU_FEATURE_DE
  - CPU_FEATURE_TSC
  - CPU_FEATURE_MSR
  - CPU_FEATURE_CX8
  - CPU_FEATURE_CMOV
  - CPU_FEATURE_MMX

timing_profile: "timings/pentium.yaml"

code_morphing_engine:
  vliw_width_bits: 128
  cms_version: "4.4.8"
  hardware_shadow_registers: true

cache:
  l1_instruction_kb: 64
  l1_data_kb: 64
  l2_kb: 512

