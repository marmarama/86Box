# arithmetic.yaml - Integer Arithmetic Instruction Families

families:
  ADD:
    description: "Add with Carry Status Update"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x00": { dst: Eb, src: Gb }
      "0x01": { dst: Ev, src: Gv }
      "0x02": { dst: Gb, src: Eb }
      "0x03": { dst: Gv, src: Ev }
      "0x04": { dst: AL, src: Ib }
      "0x05": { dst: eAX, src: Iv }
      "0x80 /0": { dst: Eb, src: Ib }
      "0x81 /0": { dst: Ev, src: Iv }
      "0x82 /0": { dst: Eb, src: Ib }
      "0x83 /0": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_BINARY
      op: ADD
      inputs: [dst, src]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_ADD
        op1: dst
        op2: src
        res: output

  ADC:
    description: "Add with Carry"
    availability: { min_cpu: CPU_8086 }
    class: alu_carry
    opcode_map:
      "0x10": { dst: Eb, src: Gb }
      "0x11": { dst: Ev, src: Gv }
      "0x12": { dst: Gb, src: Eb }
      "0x13": { dst: Gv, src: Ev }
      "0x14": { dst: AL, src: Ib }
      "0x15": { dst: eAX, src: Iv }
      "0x80 /2": { dst: Eb, src: Ib }
      "0x81 /2": { dst: Ev, src: Iv }
      "0x82 /2": { dst: Eb, src: Ib }
      "0x83 /2": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_BINARY
      op: ADC
      carry_in: true
      inputs: [dst, src]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_ADC
        op1: dst
        op2: src
        res: output

  SUB:
    description: "Subtract"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x28": { dst: Eb, src: Gb }
      "0x29": { dst: Ev, src: Gv }
      "0x2A": { dst: Gb, src: Eb }
      "0x2B": { dst: Gv, src: Ev }
      "0x2C": { dst: AL, src: Ib }
      "0x2D": { dst: eAX, src: Iv }
      "0x80 /5": { dst: Eb, src: Ib }
      "0x81 /5": { dst: Ev, src: Iv }
      "0x82 /5": { dst: Eb, src: Ib }
      "0x83 /5": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_BINARY
      op: SUB
      inputs: [dst, src]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_SUB
        op1: dst
        op2: src
        res: output

  SBB:
    description: "Subtract with Borrow"
    availability: { min_cpu: CPU_8086 }
    class: alu_carry
    opcode_map:
      "0x18": { dst: Eb, src: Gb }
      "0x19": { dst: Ev, src: Gv }
      "0x1A": { dst: Gb, src: Eb }
      "0x1B": { dst: Gv, src: Ev }
      "0x1C": { dst: AL, src: Ib }
      "0x1D": { dst: eAX, src: Iv }
      "0x80 /3": { dst: Eb, src: Ib }
      "0x81 /3": { dst: Ev, src: Iv }
      "0x82 /3": { dst: Eb, src: Ib }
      "0x83 /3": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_BINARY
      op: SBB
      carry_in: true
      inputs: [dst, src]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_SBB
        op1: dst
        op2: src
        res: output

  CMP:
    description: "Compare Two Operands (SUB with suppressed writeback)"
    inherit: SUB
    availability: { min_cpu: CPU_8086 }
    class: cmp
    opcode_map:
      "0x38": { dst: Eb, src: Gb }
      "0x39": { dst: Ev, src: Gv }
      "0x3A": { dst: Gb, src: Eb }
      "0x3B": { dst: Gv, src: Ev }
      "0x3C": { dst: AL, src: Ib }
      "0x3D": { dst: eAX, src: Iv }
      "0x80 /7": { dst: Eb, src: Ib }
      "0x81 /7": { dst: Ev, src: Iv }
      "0x82 /7": { dst: Eb, src: Ib }
      "0x83 /7": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_COMPARE
      op: SUB
      inputs: [dst, src]
      output: none
      fault_atomic: false
      flags:
        tag: FLAGS_SUB
        op1: dst
        op2: src
        res: compute_only

  INC:
    description: "Increment by 1 (preserves Carry Flag)"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0xFE /0":    { dst: Eb }
      "0xFF /0":    { dst: Ev }
      "0x40..0x47": { dst: "gprv[reg]" }
    semantics:
      action: ALU_UNARY
      op: ADD
      inputs: [dst]
      operand2_constant: 1
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_INC
        op1: dst
        op2: 1
        res: output
        preserve: [CF]

  DEC:
    description: "Decrement by 1 (preserves Carry Flag)"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0xFE /1":    { dst: Eb }
      "0xFF /1":    { dst: Ev }
      "0x48..0x4F": { dst: "gprv[reg]" }
    semantics:
      action: ALU_UNARY
      op: SUB
      inputs: [dst]
      operand2_constant: 1
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_DEC
        op1: dst
        op2: 1
        res: output
        preserve: [CF]

  NEG:
    description: "Two's Complement Negation (0 - dst)"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0xF6 /3": { dst: Eb }
      "0xF7 /3": { dst: Ev }
    semantics:
      action: ALU_UNARY
      op: NEG
      inputs: [dst]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_SUB
        op1: 0
        op2: dst
        res: output

  IMUL:
    description: "Signed Multiply (Single/Two/Three Operand Forms)"
    availability: { min_cpu: CPU_8086 }
    class: mul
    opcode_map:
      "0xF6 /5": { src: Eb, dst: AL, implicit_dst: AX }
      "0xF7 /5": { src: Ev, dst: eAX, implicit_dst: [eAX, eDX] }
      "0x69":    { dst: Gv, src: [Ev, Iv], min_cpu: CPU_186 }
      "0x6B":    { dst: Gv, src: [Ev, Ib_sext], min_cpu: CPU_186 }
      "0x0F 0xAF": { dst: Gv, src: Ev, min_cpu: CPU_386 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_imul

  MUL:
    description: "Unsigned Multiply"
    availability: { min_cpu: CPU_8086 }
    class: mul
    opcode_map:
      "0xF6 /4": { src: Eb, dst: AL, implicit_dst: AX }
      "0xF7 /4": { src: Ev, dst: eAX, implicit_dst: [eAX, eDX] }
    semantics:
      action: CALL_HELPER
      helper_fn: op_mul

  IDIV:
    description: "Signed Integer Division"
    availability: { min_cpu: CPU_8086 }
    class: div
    opcode_map:
      "0xF6 /7": { src: Eb, implicit_src: AX, implicit_dst: [AL, AH] }
      "0xF7 /7": { src: Ev, implicit_src: [eAX, eDX], implicit_dst: [eAX, eDX] }
    semantics:
      action: CALL_HELPER
      helper_fn: op_idiv

  DIV:
    description: "Unsigned Integer Division"
    availability: { min_cpu: CPU_8086 }
    class: div
    opcode_map:
      "0xF6 /6": { src: Eb, implicit_src: AX, implicit_dst: [AL, AH] }
      "0xF7 /6": { src: Ev, implicit_src: [eAX, eDX], implicit_dst: [eAX, eDX] }
    semantics:
      action: CALL_HELPER
      helper_fn: op_div

  DAA:
    description: "Decimal Adjust AL after Addition"
    availability: { min_cpu: CPU_8086 }
    class: bcd_adjust
    opcode_map:
      "0x27": { dst: AL, src: AL }
    semantics:
      action: CALL_HELPER
      helper_fn: op_daa

  DAS:
    description: "Decimal Adjust AL after Subtraction"
    availability: { min_cpu: CPU_8086 }
    class: bcd_adjust
    opcode_map:
      "0x2F": { dst: AL, src: AL }
    semantics:
      action: CALL_HELPER
      helper_fn: op_das

  AAA:
    description: "ASCII Adjust AL after Addition"
    availability: { min_cpu: CPU_8086 }
    class: bcd_adjust
    opcode_map:
      "0x37": { dst: eAX, src: eAX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_aaa

  AAS:
    description: "ASCII Adjust AL after Subtraction"
    availability: { min_cpu: CPU_8086 }
    class: bcd_adjust
    opcode_map:
      "0x3F": { dst: eAX, src: eAX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_aas

  AAM:
    description: "ASCII Adjust AX after Multiply"
    availability: { min_cpu: CPU_8086 }
    class: bcd_adjust
    opcode_map:
      "0xD4": { dst: eAX, src: [eAX, Ib] }
    semantics:
      action: CALL_HELPER
      helper_fn: op_aam

  AAD:
    description: "ASCII Adjust AX before Division"
    availability: { min_cpu: CPU_8086 }
    class: bcd_adjust
    opcode_map:
      "0xD5": { dst: eAX, src: [eAX, Ib] }
    semantics:
      action: CALL_HELPER
      helper_fn: op_aad

  SALC:
    description: "Set AL on Carry (Undocumented 8086 opcode)"
    availability: { min_cpu: CPU_8086 }
    class: salc
    opcode_map:
      "0xD6": { dst: AL, src: AL }
    semantics:
      action: CALL_HELPER
      helper_fn: op_salc
