# logic_and_bit.yaml - Boolean Logic and Bit Manipulation Families

families:
  AND:
    description: "Logical AND"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x20": { dst: Eb, src: Gb }
      "0x21": { dst: Ev, src: Gv }
      "0x22": { dst: Gb, src: Eb }
      "0x23": { dst: Gv, src: Ev }
      "0x24": { dst: AL, src: Ib }
      "0x25": { dst: eAX, src: Iv }
      "0x80 /4": { dst: Eb, src: Ib }
      "0x81 /4": { dst: Ev, src: Iv }
      "0x82 /4": { dst: Eb, src: Ib }
      "0x83 /4": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_BINARY
      op: AND
      inputs: [dst, src]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_LOGIC
        op1: output
        op2: 0
        res: output

  OR:
    description: "Logical Inclusive OR"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x08": { dst: Eb, src: Gb }
      "0x09": { dst: Ev, src: Gv }
      "0x0A": { dst: Gb, src: Eb }
      "0x0B": { dst: Gv, src: Ev }
      "0x0C": { dst: AL, src: Ib }
      "0x0D": { dst: eAX, src: Iv }
      "0x80 /1": { dst: Eb, src: Ib }
      "0x81 /1": { dst: Ev, src: Iv }
      "0x82 /1": { dst: Eb, src: Ib }
      "0x83 /1": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_BINARY
      op: OR
      inputs: [dst, src]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_LOGIC
        op1: output
        op2: 0
        res: output

  XOR:
    description: "Logical Exclusive OR"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x30": { dst: Eb, src: Gb }
      "0x31": { dst: Ev, src: Gv }
      "0x32": { dst: Gb, src: Eb }
      "0x33": { dst: Gv, src: Ev }
      "0x34": { dst: AL, src: Ib }
      "0x35": { dst: eAX, src: Iv }
      "0x80 /6": { dst: Eb, src: Ib }
      "0x81 /6": { dst: Ev, src: Iv }
      "0x82 /6": { dst: Eb, src: Ib }
      "0x83 /6": { dst: Ev, src: Ib_sext }
    semantics:
      action: ALU_BINARY
      op: XOR
      inputs: [dst, src]
      output: dst
      fault_atomic: true
      flags:
        tag: FLAGS_LOGIC
        op1: output
        op2: 0
        res: output

  TEST:
    description: "Logical Compare (AND with suppressed writeback)"
    inherit: AND
    availability: { min_cpu: CPU_8086 }
    class: bit_test
    opcode_map:
      "0x84": { dst: Eb, src: Gb }
      "0x85": { dst: Ev, src: Gv }
      "0xA8": { dst: AL, src: Ib }
      "0xA9": { dst: eAX, src: Iv }
      "0xF6 /0": { dst: Eb, src: Ib }
      "0xF7 /0": { dst: Ev, src: Iv }
    semantics:
      action: ALU_COMPARE
      op: AND
      inputs: [dst, src]
      output: none
      fault_atomic: false
      flags:
        tag: FLAGS_LOGIC
        op1: compute_only
        op2: 0
        res: compute_only

  NOT:
    description: "One's Complement Negation (~dst)"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0xF6 /2": { dst: Eb }
      "0xF7 /2": { dst: Ev }
    semantics:
      action: ALU_UNARY
      op: NOT
      inputs: [dst]
      output: dst
      fault_atomic: true
      flags: none

  BT:
    description: "Bit Test (Copies selected bit into Carry Flag)"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xA3":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /4": { base: Ev, bit_offset: Ib }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bt

  BTS:
    description: "Bit Test and Set"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xAB":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /5": { base: Ev, bit_offset: Ib }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bts

  BTR:
    description: "Bit Test and Reset"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xB3":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /6": { base: Ev, bit_offset: Ib }
    semantics:
      action: CALL_HELPER
      helper_fn: op_btr

  BTC:
    description: "Bit Test and Complement"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xBB":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /7": { base: Ev, bit_offset: Ib }
    semantics:
      action: CALL_HELPER
      helper_fn: op_btc

  BSF:
    description: "Bit Scan Forward (least significant 1-bit)"
    availability: { min_cpu: CPU_386 }
    class: bit_scan
    opcode_map:
      "0x0F 0xBC": { dst: Gv, src: Ev }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bsf

  BSR:
    description: "Bit Scan Reverse (most significant 1-bit)"
    availability: { min_cpu: CPU_386 }
    class: bit_scan
    opcode_map:
      "0x0F 0xBD": { dst: Gv, src: Ev }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bsr
