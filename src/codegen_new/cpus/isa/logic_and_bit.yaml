# logic_and_bit.yaml - Boolean Logic and Bit Manipulation Families

families:
  AND:
    description: "Logical AND"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x20": { dst: Eb, src: Gb }
      "0x21": { dst: Ev, src: Gv }
      "0x22": { dst: Gb, src: Eb }
      "0x23": { dst: Gv, src: Ev }
      "0x24": { dst: AL, src: Ib }
      "0x25": { dst: eAX, src: Iv }
      "0x80 /4": { dst: Eb, src: Ib, group: group_1, group_ext: 4 }
      "0x81 /4": { dst: Ev, src: Iv, group: group_1, group_ext: 4 }
      "0x82 /4": { dst: Eb, src: Ib, group: group_1, group_ext: 4 }
      "0x83 /4": { dst: Ev, src: Ib_sext, group: group_1, group_ext: 4 }
    semantics:
      action: ALU_BINARY
      op: AND
      carry: none
      inputs: [dst, src]
      output: dst
      fault_policy: FAULT_ATOMIC
      flags:
        tag: FLAGS_LOGIC
        op1: output
        op2: 0
        res: output
        update: [PF, ZF, SF]
        forced_clear: [CF, OF]
        undefined: [AF]

  OR:
    description: "Logical Inclusive OR"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x08": { dst: Eb, src: Gb }
      "0x09": { dst: Ev, src: Gv }
      "0x0A": { dst: Gb, src: Eb }
      "0x0B": { dst: Gv, src: Ev }
      "0x0C": { dst: AL, src: Ib }
      "0x0D": { dst: eAX, src: Iv }
      "0x80 /1": { dst: Eb, src: Ib, group: group_1, group_ext: 1 }
      "0x81 /1": { dst: Ev, src: Iv, group: group_1, group_ext: 1 }
      "0x82 /1": { dst: Eb, src: Ib, group: group_1, group_ext: 1 }
      "0x83 /1": { dst: Ev, src: Ib_sext, group: group_1, group_ext: 1 }
    semantics:
      action: ALU_BINARY
      op: OR
      carry: none
      inputs: [dst, src]
      output: dst
      fault_policy: FAULT_ATOMIC
      flags:
        tag: FLAGS_LOGIC
        op1: output
        op2: 0
        res: output
        update: [PF, ZF, SF]
        forced_clear: [CF, OF]
        undefined: [AF]

  XOR:
    description: "Logical Exclusive OR"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0x30": { dst: Eb, src: Gb }
      "0x31": { dst: Ev, src: Gv }
      "0x32": { dst: Gb, src: Eb }
      "0x33": { dst: Gv, src: Ev }
      "0x34": { dst: AL, src: Ib }
      "0x35": { dst: eAX, src: Iv }
      "0x80 /6": { dst: Eb, src: Ib, group: group_1, group_ext: 6 }
      "0x81 /6": { dst: Ev, src: Iv, group: group_1, group_ext: 6 }
      "0x82 /6": { dst: Eb, src: Ib, group: group_1, group_ext: 6 }
      "0x83 /6": { dst: Ev, src: Ib_sext, group: group_1, group_ext: 6 }
    semantics:
      action: ALU_BINARY
      op: XOR
      carry: none
      inputs: [dst, src]
      output: dst
      fault_policy: FAULT_ATOMIC
      flags:
        tag: FLAGS_LOGIC
        op1: output
        op2: 0
        res: output
        update: [PF, ZF, SF]
        forced_clear: [CF, OF]
        undefined: [AF]

  TEST:
    description: "Logical Compare (AND with suppressed writeback)"
    inherit: AND
    availability: { min_cpu: CPU_8086 }
    class: bit_test
    opcode_map:
      "0x84": { dst: Eb, src: Gb }
      "0x85": { dst: Ev, src: Gv }
      "0xA8": { dst: AL, src: Ib }
      "0xA9": { dst: eAX, src: Iv }
      "0xF6 /0": { dst: Eb, src: Ib, group: group_3, group_ext: 0 }
      "0xF7 /0": { dst: Ev, src: Iv, group: group_3, group_ext: 0 }
    semantics:
      action: ALU_COMPARE
      op: AND
      carry: none
      inputs: [dst, src]
      output: none
      fault_policy: READ_ONLY
      flags:
        tag: FLAGS_LOGIC
        op1: compute_only
        op2: 0
        res: compute_only
        update: [PF, ZF, SF]
        forced_clear: [CF, OF]
        undefined: [AF]

  NOT:
    description: "One's Complement Negation (~dst)"
    availability: { min_cpu: CPU_8086 }
    class: alu
    opcode_map:
      "0xF6 /2": { dst: Eb, group: group_3, group_ext: 2 }
      "0xF7 /2": { dst: Ev, group: group_3, group_ext: 2 }
    semantics:
      action: ALU_UNARY
      op: NOT
      carry: none
      inputs: [dst]
      output: dst
      fault_policy: FAULT_ATOMIC
      flags: none

  BT:
    description: "Bit Test (Copies selected bit into Carry Flag)"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xA3":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /4": { base: Ev, bit_offset: Ib, group: group_8, group_ext: 4 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bt
      fault_policy: READ_ONLY
      flags:
        update: [CF]
        undefined: [OF, SF, ZF, AF, PF]

  BTS:
    description: "Bit Test and Set"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xAB":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /5": { base: Ev, bit_offset: Ib, group: group_8, group_ext: 5 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bts
      fault_policy: FAULT_ATOMIC
      flags:
        update: [CF]
        undefined: [OF, SF, ZF, AF, PF]

  BTR:
    description: "Bit Test and Reset"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xB3":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /6": { base: Ev, bit_offset: Ib, group: group_8, group_ext: 6 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_btr
      fault_policy: FAULT_ATOMIC
      flags:
        update: [CF]
        undefined: [OF, SF, ZF, AF, PF]

  BTC:
    description: "Bit Test and Complement"
    availability: { min_cpu: CPU_386 }
    class: bit_test
    opcode_map:
      "0x0F 0xBB":    { base: Ev, bit_offset: Gv }
      "0x0F 0xBA /7": { base: Ev, bit_offset: Ib, group: group_8, group_ext: 7 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_btc
      fault_policy: FAULT_ATOMIC
      flags:
        update: [CF]
        undefined: [OF, SF, ZF, AF, PF]

  BSF:
    description: "Bit Scan Forward (least significant 1-bit)"
    availability: { min_cpu: CPU_386 }
    class: bit_scan
    opcode_map:
      "0x0F 0xBC": { dst: Gv, src: Ev }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bsf
      fault_policy: READ_ONLY
      flags:
        update: [ZF]
        undefined: [CF, OF, SF, AF, PF]

  BSR:
    description: "Bit Scan Reverse (most significant 1-bit)"
    availability: { min_cpu: CPU_386 }
    class: bit_scan
    opcode_map:
      "0x0F 0xBD": { dst: Gv, src: Ev }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bsr
      fault_policy: READ_ONLY
      flags:
        update: [ZF]
        undefined: [CF, OF, SF, AF, PF]
