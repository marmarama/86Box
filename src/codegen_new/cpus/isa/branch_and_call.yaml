# branch_and_call.yaml - Control Flow, Branching, and Procedure Calls

families:
  Jcc:
    description: "Jump if Condition Met"
    availability:
      min_cpu: CPU_8086 # 0x70..0x7F on 8086; 0x0F 0x80..0x8F (near 16/32-bit) requires CPU_386
    class: branch_cond
    opcode_map:
      "0x70..0x7F":      { cond: "opcode & 0x0F", target: Jb, min_cpu: CPU_8086 }
      "0x0F 0x80..0x8F": { cond: "opcode & 0x0F", target: Jv, min_cpu: CPU_386 }
    semantics:
      action: CONDITIONAL_BRANCH
      condition: cond
      displacement: target
      exit_policy: COND_2
      flags: none

  SETcc:
    description: "Set Byte on Condition"
    availability: { min_cpu: CPU_386 }
    class: alu_reg
    opcode_map:
      "0x0F 0x90..0x9F": { cond: "opcode & 0x0F", dst: Eb }
    semantics:
      action: CONDITIONAL_SET
      condition: cond
      output: dst
      true_value: 1
      false_value: 0
      flags: none

  JMP_NEAR:
    description: "Near Unconditional Jump"
    availability: { min_cpu: CPU_8086 }
    class: branch_uncond_near
    opcode_map:
      "0xEB":    { target: Jb }
      "0xE9":    { target: Jv }
      "0xFF /4": { target: Ev } # Near indirect jump
    semantics:
      action: BRANCH_NEAR
      target: target
      flags: none

  JMP_FAR:
    description: "Far Unconditional Jump (Intersegment)"
    availability: { min_cpu: CPU_8086 }
    class: branch_far
    opcode_map:
      "0xEA":    { target_cs: Iw, target_ip: Iv }
      "0xFF /5": { target_far_ptr: Mp }
    semantics:
      action: CALL_HELPER
      helper_fn: op_jmp_far

  CALL_NEAR:
    description: "Near Call Procedure"
    availability: { min_cpu: CPU_8086 }
    class: call_near
    opcode_map:
      "0xE8":    { target: Jv }
      "0xFF /2": { target: Ev }
    semantics:
      action: BRANCH_NEAR
      is_call: true
      target: target
      flags: none

  CALL_FAR:
    description: "Far Call Procedure (Intersegment)"
    availability: { min_cpu: CPU_8086 }
    class: branch_far
    opcode_map:
      "0x9A":    { target_cs: Iw, target_ip: Iv }
      "0xFF /3": { target_far_ptr: Mp }
    semantics:
      action: CALL_HELPER
      helper_fn: op_call_far

  RET_NEAR:
    description: "Return from Near Procedure"
    availability: { min_cpu: CPU_8086 }
    class: ret_near
    opcode_map:
      "0xC3": { pop_bytes: 0 }
      "0xC2": { pop_bytes: Iw }
    semantics:
      action: PROC_RETURN
      pop_bytes: pop_bytes
      is_far: false
      flags: none

  RET_FAR:
    description: "Return from Far Procedure"
    availability: { min_cpu: CPU_8086 }
    class: ret_far
    opcode_map:
      "0xCB": { pop_bytes: 0 }
      "0xCA": { pop_bytes: Iw }
    semantics:
      action: CALL_HELPER
      helper_fn: op_ret_far

  LOOP:
    description: "Loop with ECX Counter"
    availability: { min_cpu: CPU_8086 }
    class: branch_cond
    opcode_map:
      "0xE2": { target: Jb, dst: eCX, src: eCX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_loop

  LOOPE_LOOPZ:
    description: "Loop while Equal / Zero"
    availability: { min_cpu: CPU_8086 }
    class: branch_cond
    opcode_map:
      "0xE1": { target: Jb, dst: eCX, src: eCX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_loope

  LOOPNE_LOOPNZ:
    description: "Loop while Not Equal / Not Zero"
    availability: { min_cpu: CPU_8086 }
    class: branch_cond
    opcode_map:
      "0xE0": { target: Jb, dst: eCX, src: eCX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_loopne

  JCXZ_JECXZ:
    description: "Jump if CX/ECX is Zero"
    availability: { min_cpu: CPU_8086 }
    class: branch_cond
    opcode_map:
      "0xE3": { target: Jb, src: eCX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_jcxz
