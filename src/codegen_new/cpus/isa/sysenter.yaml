# sysenter.yaml - Fast System Call and State Management Instructions

families:
  SYSENTER:
    description: "Fast Transition to System Call Handler (Ring 0)"
    availability:
      min_cpu: CPU_PENTIUM2
      feature: CPU_FEATURE_SEP
      exceptions:
        - cond: "MSR_SYSENTER_CS == 0"
          fault: GP_FAULT
    class: sys_interrupt
    opcode_map:
      "0x0F 0x34": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_sysenter
      terminates_block: true

  SYSEXIT:
    description: "Fast Return from Fast System Call Handler to User Mode (Ring 3)"
    availability:
      min_cpu: CPU_PENTIUM2
      feature: CPU_FEATURE_SEP
      exceptions:
        - cond: "CPL != 0 || MSR_SYSENTER_CS == 0"
          fault: GP_FAULT
    class: sys_interrupt
    opcode_map:
      "0x0F 0x35": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_sysexit
      terminates_block: true

  FXSAVE:
    description: "Fast Save x87 FPU, MMX, and SSE State (512 bytes)"
    availability:
      min_cpu: CPU_PENTIUM2
      feature: CPU_FEATURE_FXSR
      exceptions:
        - cond: "(CR0 & (CR0_EM | CR0_TS)) != 0"
          fault: NM_FAULT
        - cond: "(dst.address & 15) != 0"
          fault: GP_FAULT # Requires 16-byte alignment
    class: sys_control
    opcode_map:
      "0x0F 0xAE /0": { dst: M512 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_fxsave

  FXRSTOR:
    description: "Fast Restore x87 FPU, MMX, and SSE State (512 bytes)"
    availability:
      min_cpu: CPU_PENTIUM2
      feature: CPU_FEATURE_FXSR
      exceptions:
        - cond: "(CR0 & (CR0_EM | CR0_TS)) != 0"
          fault: NM_FAULT
        - cond: "(src.address & 15) != 0"
          fault: GP_FAULT # Requires 16-byte alignment
    class: sys_control
    opcode_map:
      "0x0F 0xAE /1": { src: M512 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_fxrstor

  SYSCALL:
    description: "AMD Fast System Call (Ring 0 transition saving Return IP in ECX)"
    availability:
      min_cpu: CPU_PENTIUM
      feature: CPU_FEATURE_SYSCALL
    class: sys_interrupt
    opcode_map:
      "0x0F 0x05": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_syscall
      terminates_block: true

  SYSRET:
    description: "AMD Fast Return from System Call (Return to Ring 3 using IP from ECX)"
    availability:
      min_cpu: CPU_PENTIUM
      feature: CPU_FEATURE_SYSCALL
    class: sys_interrupt
    opcode_map:
      "0x0F 0x07": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_sysret
      terminates_block: true
