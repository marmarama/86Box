# system_and_misc.yaml - System, Processor Control, and Miscellaneous Families

families:
  NOP:
    description: "No Operation"
    availability: { min_cpu: CPU_8086 }
    class: nop
    opcode_map:
      "0x90": { none: 0 }
    semantics:
      action: DATA_TRANSFER
      op: MOV
      flags: none

  HLT:
    description: "Halt Processor until Interrupt"
    availability:
      min_cpu: CPU_8086
      exceptions:
        - cond: "CPL > 0"
          fault: GP_FAULT
    class: sys_control
    opcode_map:
      "0xF4": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_hlt

  CLI:
    description: "Clear Interrupt Flag"
    availability:
      min_cpu: CPU_8086
      exceptions:
        - cond: "CPL > IOPL"
          fault: GP_FAULT
    class: sys_control
    opcode_map:
      "0xFA": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_cli

  STI:
    description: "Set Interrupt Flag"
    availability:
      min_cpu: CPU_8086
      exceptions:
        - cond: "CPL > IOPL"
          fault: GP_FAULT
    class: sys_control
    opcode_map:
      "0xFB": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_sti

  CLD:
    description: "Clear Direction Flag"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0xFC": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_cld

  STD:
    description: "Set Direction Flag"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0xFD": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_std

  CLC:
    description: "Clear Carry Flag"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0xF8": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_clc

  STC:
    description: "Set Carry Flag"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0xF9": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_stc

  CMC:
    description: "Complement Carry Flag"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0xF5": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_cmc

  CPUID:
    description: "CPU Identification"
    availability:
      min_cpu: CPU_486
    class: sys_control
    opcode_map:
      "0x0F 0xA2": { leaf: EAX, sub_leaf: ECX }
    semantics:
      action: CALL_HELPER
      helper_fn: x86_cpuid

  RDTSC:
    description: "Read Time-Stamp Counter"
    availability:
      min_cpu: CPU_PENTIUM
      feature: CPU_FEATURE_RDTSC
      exceptions:
        - cond: "(CR4 & CR4_TSD) && (CPL != 0)"
          fault: GP_FAULT
    class: sys_control
    opcode_map:
      "0x0F 0x31": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_rdtsc

  INT:
    description: "Software Interrupt / Call to Interrupt Handler"
    availability: { min_cpu: CPU_8086 }
    class: sys_interrupt
    opcode_map:
      "0xCD": { vector: Ib }
      "0xCC": { vector: 3 } # INT 3 (Breakpoint)
    semantics:
      action: CALL_HELPER
      helper_fn: op_int

  INTO:
    description: "Interrupt on Overflow (INT 4 if OF == 1)"
    availability: { min_cpu: CPU_8086 }
    class: sys_interrupt
    opcode_map:
      "0xCE": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_into

  IRET_IRETD:
    description: "Interrupt Return"
    availability: { min_cpu: CPU_8086 }
    class: sys_interrupt
    opcode_map:
      "0xCF": { operand_size_16: { is_32: false }, operand_size_32: { is_32: true } }
    semantics:
      action: CALL_HELPER
      helper_fn: op_iret

  BOUND:
    description: "Check Array Index Against Bounds"
    availability: { min_cpu: CPU_186 }
    class: bounds_check
    opcode_map:
      "0x62": { src: Gv, bounds: Ma }
    semantics:
      action: CALL_HELPER
      helper_fn: op_bound

  ARPL:
    description: "Adjust RPL Field of Segment Selector"
    availability: { min_cpu: CPU_286 }
    class: arpl
    opcode_map:
      "0x63": { dst: Ew, src: Gw }
    semantics:
      action: CALL_HELPER
      helper_fn: op_arpl

  SAHF:
    description: "Store AH into Flags (SF, ZF, AF, PF, CF)"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0x9E": { src: AH }
    semantics:
      action: CALL_HELPER
      helper_fn: op_sahf

  LAHF:
    description: "Load Status Flags into AH"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0x9F": { dst: AH }
    semantics:
      action: CALL_HELPER
      helper_fn: op_lahf

  WAIT:
    description: "Wait / Check Pending Unmasked Coprocessor Floating-Point Exceptions"
    availability: { min_cpu: CPU_8086 }
    class: sys_control
    opcode_map:
      "0x9B": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_wait
