# mov_and_transfer.yaml - Data Movement & Type Transfer Families

families:
  MOV:
    description: "Move Data between Registers and Memory"
    availability: { min_cpu: CPU_8086 }
    class: mov
    opcode_map:
      "0x88": { dst: Eb, src: Gb }
      "0x89": { dst: Ev, src: Gv }
      "0x8A": { dst: Gb, src: Eb }
      "0x8B": { dst: Gv, src: Ev }
      "0x8C": { dst: Ew, src: Sw }
      "0x8E": { dst: Sw, src: Ew }
      "0xA0": { dst: AL, src: Ob }
      "0xA1": { dst: eAX, src: Ov }
      "0xA2": { dst: Ob, src: AL }
      "0xA3": { dst: Ov, src: eAX }
      "0xB0..0xB7": { dst: "gpr8[reg]", src: Ib }
      "0xB8..0xBF": { dst: "gprv[reg]", src: Iv }
      "0xC6 /0": { dst: Eb, src: Ib, group: group_11, group_ext: 0 }
      "0xC7 /0": { dst: Ev, src: Iv, group: group_11, group_ext: 0 }
    semantics:
      action: DATA_TRANSFER
      op: MOV
      carry: none
      inputs: [src]
      output: dst
      fault_policy: FAULT_ATOMIC
      flags: none

  MOVZX:
    description: "Move with Zero-Extend"
    availability: { min_cpu: CPU_386 }
    class: mov_extend
    opcode_map:
      "0x0F 0xB6": { dst: Gv, src: Eb }
      "0x0F 0xB7": { dst: Gv, src: Ew }
    semantics:
      action: DATA_TRANSFER
      op: MOVZX
      carry: none
      inputs: [src]
      output: dst
      fault_policy: READ_ONLY
      flags: none

  MOVSX:
    description: "Move with Sign-Extend"
    availability: { min_cpu: CPU_386 }
    class: mov_extend
    opcode_map:
      "0x0F 0xBE": { dst: Gv, src: Eb }
      "0x0F 0xBF": { dst: Gv, src: Ew }
    semantics:
      action: DATA_TRANSFER
      op: MOVSX
      carry: none
      inputs: [src]
      output: dst
      fault_policy: READ_ONLY
      flags: none

  LEA:
    description: "Load Effective Address"
    availability: { min_cpu: CPU_8086 }
    class: lea
    opcode_map:
      "0x8D": { dst: Gv, src: M }
    semantics:
      action: DATA_TRANSFER
      op: MOV
      inputs: [src]
      output: dst
      fault_atomic: false
      flags: none

  XCHG:
    description: "Exchange Register/Memory with Register"
    availability: { min_cpu: CPU_8086 }
    class: xchg
    opcode_map:
      "0x86": { op1: Eb, op2: Gb }
      "0x87": { op1: Ev, op2: Gv }
      "0x91..0x97": { op1: eAX, op2: "gprv[reg]" }
    semantics:
      action: DATA_TRANSFER
      op: XCHG
      inputs: [op1, op2]
      output: [op1, op2]
      fault_atomic: true
      flags: none

  CBW_CWDE:
    description: "Convert Byte to Word / Word to Doubleword"
    availability:
      min_cpu: CPU_8086 # CBW on 8086; CWDE requires CPU_386
    class: alu_reg
    opcode_map:
      "0x98": { dst: eAX, src: eAX }
    semantics:
      action: DATA_TRANSFER
      op: MOVSX
      inputs: [src]
      output: dst
      fault_atomic: false
      flags: none

  CWD_CDQ:
    description: "Convert Word to Doubleword / Doubleword to Quadword in EDX:EAX"
    availability:
      min_cpu: CPU_8086 # CWD on 8086; CDQ requires CPU_386
    class: alu_reg
    opcode_map:
      "0x99": { dst: eDX, src: eAX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_cwd

  BSWAP:
    description: "Byte Swap (32-bit endian reversal)"
    availability: { min_cpu: CPU_486 }
    class: alu_reg
    opcode_map:
      "0x0F 0xC8..0xCF": { dst: "gpr32[reg]" }
    semantics:
      action: DATA_TRANSFER
      op: BSWAP
      inputs: [dst]
      output: dst
      fault_atomic: false
      flags: none

  XLAT:
    description: "Table Look-up Translation (AL = [EBX + AL])"
    availability: { min_cpu: CPU_8086 }
    class: xlat
    opcode_map:
      "0xD7": { dst: AL, src: AL, base: eBX }
    semantics:
      action: CALL_HELPER
      helper_fn: op_xlat

  LES:
    description: "Load Full Pointer into ES and Register"
    availability: { min_cpu: CPU_8086 }
    class: mov_ptr
    opcode_map:
      "0xC4": { dst: [Gv, ES], src: Mp }
    semantics:
      action: CALL_HELPER
      helper_fn: op_les

  LDS:
    description: "Load Full Pointer into DS and Register"
    availability: { min_cpu: CPU_8086 }
    class: mov_ptr
    opcode_map:
      "0xC5": { dst: [Gv, DS], src: Mp }
    semantics:
      action: CALL_HELPER
      helper_fn: op_lds

  LSS:
    description: "Load Full Pointer into SS and Register"
    availability: { min_cpu: CPU_386 }
    class: mov_ptr
    opcode_map:
      "0x0F 0xB2": { dst: [Gv, SS], src: Mp }
    semantics:
      action: CALL_HELPER
      helper_fn: op_lss

  LFS:
    description: "Load Full Pointer into FS and Register"
    availability: { min_cpu: CPU_386 }
    class: mov_ptr
    opcode_map:
      "0x0F 0xB4": { dst: [Gv, FS], src: Mp }
    semantics:
      action: CALL_HELPER
      helper_fn: op_lfs

  LGS:
    description: "Load Full Pointer into GS and Register"
    availability: { min_cpu: CPU_386 }
    class: mov_ptr
    opcode_map:
      "0x0F 0xB5": { dst: [Gv, GS], src: Mp }
    semantics:
      action: CALL_HELPER
      helper_fn: op_lgs
