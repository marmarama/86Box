# stack_and_frame.yaml - Stack Operations and Stack Frame Management

families:
  PUSH:
    description: "Push Value onto the Stack"
    availability:
      min_cpu: CPU_8086 # Reg/Seg on 8086; Imm on 186; FS/GS on 386
    class: stack_push
    opcode_map:
      "0x50..0x57": { src: "gprv[reg]", min_cpu: CPU_8086 }
      "0x06":       { src: ES, min_cpu: CPU_8086 }
      "0x0E":       { src: CS, min_cpu: CPU_8086 }
      "0x16":       { src: SS, min_cpu: CPU_8086 }
      "0x1E":       { src: DS, min_cpu: CPU_8086 }
      "0x0F 0xA0":  { src: FS, min_cpu: CPU_386 }
      "0x0F 0xA8":  { src: GS, min_cpu: CPU_386 }
      "0x68":       { src: Iv, min_cpu: CPU_186 }
      "0x6A":       { src: Ib_sext, min_cpu: CPU_186 }
      "0xFF /6":    { src: Ev, min_cpu: CPU_8086 }
    semantics:
      action: STACK_OP
      op: PUSH
      inputs: [src]
      flags: none

  POP:
    description: "Pop Value from the Stack"
    availability:
      min_cpu: CPU_8086 # Reg/Seg on 8086; FS/GS on 386
    class: stack_pop
    opcode_map:
      "0x58..0x5F": { dst: "gprv[reg]", min_cpu: CPU_8086 }
      "0x07":       { dst: ES, min_cpu: CPU_8086 }
      "0x17":       { dst: SS, min_cpu: CPU_8086 }
      "0x1F":       { dst: DS, min_cpu: CPU_8086 }
      "0x0F 0xA1":  { dst: FS, min_cpu: CPU_386 }
      "0x0F 0xA9":  { dst: GS, min_cpu: CPU_386 }
      "0x8F /0":    { dst: Ev, min_cpu: CPU_8086 }
    semantics:
      action: STACK_OP
      op: POP
      output: dst
      flags: none

  PUSHA_PUSHAD:
    description: "Push All General-Purpose Registers"
    availability: { min_cpu: CPU_186 }
    class: stack_push
    opcode_map:
      "0x60": { operand_size_16: { regs: [AX, CX, DX, BX, SP, BP, SI, DI] },
                operand_size_32: { regs: [EAX, ECX, EDX, EBX, ESP, EBP, ESI, EDI] } }
    semantics:
      action: CALL_HELPER
      helper_fn: op_pusha

  POPA_POPAD:
    description: "Pop All General-Purpose Registers"
    availability: { min_cpu: CPU_186 }
    class: stack_pop
    opcode_map:
      "0x61": { operand_size_16: { regs: [DI, SI, BP, SP_skip, BX, DX, CX, AX] },
                operand_size_32: { regs: [EDI, ESI, EBP, ESP_skip, EBX, EDX, ECX, EAX] } }
    semantics:
      action: CALL_HELPER
      helper_fn: op_popa

  PUSHF_PUSHFD:
    description: "Push Flags onto Stack"
    availability: { min_cpu: CPU_8086 }
    class: stack_push
    opcode_map:
      "0x9C": { operand_size_16: { src: FLAGS }, operand_size_32: { src: EFLAGS } }
    semantics:
      action: CALL_HELPER
      helper_fn: op_pushf

  POPF_POPFD:
    description: "Pop Flags from Stack"
    availability: { min_cpu: CPU_8086 }
    class: stack_pop
    opcode_map:
      "0x9D": { operand_size_16: { dst: FLAGS }, operand_size_32: { dst: EFLAGS } }
    semantics:
      action: CALL_HELPER
      helper_fn: op_popf

  ENTER:
    description: "Make Stack Frame for Procedure Parameters"
    availability: { min_cpu: CPU_186 }
    class: stack_push
    opcode_map:
      "0xC8": { alloc_size: Iw, nesting_level: Ib }
    semantics:
      action: CALL_HELPER
      helper_fn: op_enter

  LEAVE:
    description: "High Level Procedure Exit"
    availability: { min_cpu: CPU_186 }
    class: stack_pop
    opcode_map:
      "0xC9": { none: 0 }
    semantics:
      action: CALL_HELPER
      helper_fn: op_leave
