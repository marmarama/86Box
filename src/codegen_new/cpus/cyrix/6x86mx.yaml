# 6x86mx.yaml - Cyrix 6x86MX (M2)

model:
  cpu_id: CPU_Cx6x86MX
  name: "Cyrix 6x86MX (M2)"
  vendor: "CyrixInstead"
  release_year: 1997
  family: 6
  model_id: 0
  stepping: 5
  package: [SOCKET_7]
  cpu_frequencies_mhz: [133, 150, 166, 188, 208, 225, 250]
  emulated_frequency_range_mhz: [100, 250]
  default_emulated_frequencies_mhz: [100, 133, 150, 166, 188, 208, 225, 250]

cpuid:
  signature: 0x00000605
  features_edx: 0x008020BF # FPU, VME, DE, TSC, MSR, CX8, PGE, MMX

isa_level: CPU_PENTIUM
features:
  - CPU_FEATURE_FPU
  - CPU_FEATURE_VME
  - CPU_FEATURE_DE
  - CPU_FEATURE_TSC
  - CPU_FEATURE_MSR
  - CPU_FEATURE_CX8
  - CPU_FEATURE_PGE
  - CPU_FEATURE_MMX

timing_profile: "timings/cyrix_686.yaml"

cache:
  l1_unified_kb: 64 # Unified L1 code/data cache

quirks:
  - id: ERRATUM_CYRIX_COMA
    name: "Cyrix 6x86 Coma Bug (Infinite Loop Pipeline Lockup)"
    category: TLB_CACHE_HANG
    description: |
      An unaligned branch or tight infinite loop spanning a cache line boundary
      can starve pipeline arbitration and lock up the execution core indefinitely.
    steppings_affected:
      family: 6
      models: [0]
      stepping_mask: "<= 1"
    trigger:
      opcode_sequence: [0xEB, 0xFE] # JMP $
      condition: "CACHE_LINE_SPLIT"
    behavior:
      type: HANG_BUS_LOCK
      synthesized_action: "cyrix_pipeline_deadlock(cpu);"
    fixed_in: "MII stepping 2+"


